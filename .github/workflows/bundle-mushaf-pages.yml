name: Bundle Mushaf pages
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: bundle-mushaf-pages
  cancel-in-progress: false
jobs:
  download-and-commit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Download and verify all 604 pages
        run: python3 scripts/download-mushaf-pages.py
      - name: Commit the local page images
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/mushaf/hafsTajweed
          git commit -m "Bundle 604 Mushaf page images locally"
          git push origin HEAD:main
